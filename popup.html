<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <title>LiveHeader</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <div id="permBanner" class="permbanner" hidden>
    <span data-i18n="hostPermissionMissing"></span>
    <button id="grantPerm" class="btn" data-i18n="grantHostPermission">Allow access</button>
  </div>
  <div id="permNotice" class="permnotice" hidden>
    <span data-i18n="hostPermissionLimited"></span>
    <span id="permSites" class="permsites"></span>
  </div>
  <div class="app">
    <aside class="side">
      <h2 data-i18n="profiles">PROFILES</h2>
      <div id="profileList" class="plist"></div>
      <button id="addProfile" class="btn wide" data-i18n="addProfile">＋ Create Profile</button>
    </aside>
    <main class="main" id="main"></main>
  </div>
  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>

</html>
